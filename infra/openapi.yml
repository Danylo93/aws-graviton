    description: Get all access profiles, ideal for selects and simple listings
    externalDocs:
      description: Find out more
      url: "/docs/arcs/access_profile"
  - name: Apps
    description: Management of client application
    externalDocs:
      description: Find out more
      url: "/docs/arcs-service/apps"
  - name: Config
    description: Managing profile settings in client applications
    externalDocs:
      description: Find out more
      url: "/docs/arcs-service/config"
  - name: ContactTypes
    description: List  contact types in client applications
    externalDocs:
      description: Find out more
      url: "/docs/arcs-service/config"
  - name: Dashboard
    description: Management of dashboards
    externalDocs:
      description: Find out more
      url: "/docs/arcs-service/dash"
  - name: FiaCardTypes
    description: Managing fia card types in application
    externalDocs:
      description: Find out more
      url: "/docs/arcs-service/fia_card_types"
  - name: CBACardTypes
    description: Managing cba card types in application
    externalDocs:
      description: Find out more
      url: "/docs/arcs-service/cba_card_types"
  - name: Services
    description: Management of services
    externalDocs:
      description: Find out more
      url: "/docs/arcs-service/services"
  - name: Permissions
    description: Management of application permissions
    externalDocs:
      description: Find out more
      url: "/docs/arcs-service/permissions"
  - name: Auth
    description: Auth Flow in application
    externalDocs:
      description: Find out more
      url: "/docs/auth"
  - name: ResetPassword
    description: Send email and reset user password
    externalDocs:
      description: Find out more
      url: "/docs/reset_password"
  - name: Group
    description: Management of groups in application
    externalDocs:
      description: Find out more
      url: "/docs/groups"
  - name: Invite
    description: Management of invites in application
    externalDocs:
      description: Find out more
      url: "/docs/invites"
  - name: Pilots
    description: Management of pilots in application
    externalDocs:
      description: Find out more
      url: "/docs/pilots"
  - name: Logout
    description: logout in application
    externalDocs:
      description: Find out more
      url: "/docs/logout"
  - name: People
    description: Management of people in application
    externalDocs:
      description: Find out more
      url: "/docs/groups"
  - name: Profiles
    description: Management of profiles in application
    externalDocs:
      description: Find out more
      url: "/docs/profiles"
  - name: Register
    description: Management of registers in application
    externalDocs:
      description: Find out more
      url: "/docs/registers"
  - name: SubGroup
    description: Management of subgroups in application
    externalDocs:
      description: Find out more
      url: "/docs/subgroups"
  - name: PersonalTeam
    description: Management of personal team in application
    externalDocs:
      description: Find out more
      url: "/docs/personal_team"
  - name: TechnicalTeam
    description: Management of technical team in application
    externalDocs:
      description: Find out more
      url: "/docs/technical_team"
  - name: Users
    description: Management of users in application
    externalDocs:
      description: Find out more
      url: "/docs/users"
  - name: KeyContacts
    description: Management of contacts in application
    externalDocs:
      url: "/docs/key_contacts"
  - name: Health
    description: Health check endpoints
    externalDocs:
      description: Find out more
      url: "/docs/health"

paths:
  /lib/health_check:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Check the health status of the service and its dependencies (PostgreSQL, MongoDB, Redis, Storage, DAPR)
      security: []
      parameters:
        - name: resource_name
          in: query
          required: false
          description: Optional resource name to check (POSTGRES, MONGODB, REDIS, STORAGE, DAPR)
          schema:
            type: string
            enum: [POSTGRES, MONGODB, REDIS, STORAGE, DAPR]
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "SUCCESS"
                  errors:
                    type: object
                    example: {}
                  data:
                    type: object
                    properties:
                      service:
                        type: boolean
                        example: true
                      postgres:
                        type: boolean
                        example: true
                      mongodb:
                        type: boolean
                        example: false
                      redis:
                        type: boolean
                        example: true
                      storage:
                        type: boolean
                        example: true
                      dapr:
                        type: boolean
                        example: false
                  links:
                    type: array
                    items:
                      type: object
                    example: []
        '400':
          $ref: "#/components/responses/400"
        '500':
          $ref: "#/components/responses/500"

  /access_profiles/:
    get:
      tags:
        - AccessProfile
      summary: Get a list of all services
      security:
        - token_jws: []
      parameters:
        - $ref: "#/components/parameters/pagination_page"
        - $ref: "#/components/parameters/pagination_per_page"
        - $ref: "#/components/parameters/query_q"
        - $ref: "#/components/parameters/query_status"
        - $ref: "#/components/parameters/query_letter"
        - $ref: "#/components/parameters/query_limit"
        - $ref: "#/components/parameters/query_sort"
        - $ref: "#/components/parameters/query_order_by"
        - $ref: "#/components/parameters/query_deleted"
        - $ref: "#/components/parameters/query_fields"
        - $ref: "#/components/parameters/query_start_date"
        - $ref: "#/components/parameters/query_end_date"
        - $ref: "#/components/parameters/query_include_related"
        - $ref: "#/components/parameters/content_type"
        - $ref: "#/components/parameters/query_filters"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "SUCCESS"
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    allOf:
                      - $ref: "#/components/schemas/pagination_without_items"
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/AccessProfileModel"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '204':
          $ref: "#/components/responses/204"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

  /access_profiles/{profile_id}:
    get:
      tags:
        - AccessProfile
      summary: Get a Access profile
      security:
        - token_jws: []
      parameters:
        - name: profile_id
          in: path
          description: ID unique of profile
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/content_type"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "SUCCESS"
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    $ref: "#/components/schemas/AccessProfileModel"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '204':
          $ref: "#/components/responses/204"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

  /access_profiles/users/{user_id}:
    get:
      tags:
        - AccessProfile
      summary: Get a list of all access_profiles of a user
      security:
        - token_jws: []
      parameters:
        - name: user_id
          in: path
          description: ID unique of user
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/content_type"
        - name: X-App-Client
          in: header
          required: false
          example: "arcs_admin_web"
          schema:
            type: string
          description: Name of the app client, it is a filter, if it was not passed the return will be a list with all the user's access_profiles in all app_clients
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "SUCCESS"
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    type: object
                    properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/AccessProfileModel"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '204':
          $ref: "#/components/responses/204"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

  /addresses/{address_id}:
    delete:
      tags:
        - Addresses
      summary: Delete an address
      security:
        - token_jws: [ ]
      parameters:
        - name: address_id
          in: path
          description: ID of an anddress
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/content_type"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "SUCCESS"
                  errors:
                    type: array
                    items:
                      type: string
                    example: [ ]
                  data:
                    type: object
                    example: { }
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

  /app_clients/:
    get:
      tags:
        - Apps
      summary: Get a list of all client applications
      security:
        - token_jws: []
      parameters:
        - $ref: "#/components/parameters/pagination_page"
        - $ref: "#/components/parameters/pagination_per_page"
        - $ref: "#/components/parameters/query_q"
        - $ref: "#/components/parameters/query_status"
        - $ref: "#/components/parameters/query_letter"
        - $ref: "#/components/parameters/query_limit"
        - $ref: "#/components/parameters/query_sort"
        - $ref: "#/components/parameters/query_order_by"
        - $ref: "#/components/parameters/query_deleted"
        - $ref: "#/components/parameters/query_fields"
        - $ref: "#/components/parameters/query_start_date"
        - $ref: "#/components/parameters/query_end_date"
        - $ref: "#/components/parameters/query_include_related"
        - $ref: "#/components/parameters/content_type"
        - $ref: "#/components/parameters/query_filters"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Request Succefully"
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    allOf:
                      - $ref: "#/components/schemas/pagination_without_items"
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/AppClientModel"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '204':
          $ref: "#/components/responses/204"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

    post:
      tags:
        - Apps
      summary: Register a new client application
      security:
        - token_jws: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                  name:
                    type: string
                    description: "Unique name of the app client."
                  image:
                    type: string
                    format: binary
                    nullable: true
                    description: "image in base64"
                  name_friendly:
                    type: string
                    nullable: true
                    description: "A user-friendly name for the app client."
                  description:
                    type: string
                    nullable: true
                    description: "Description of the app client."

      responses:
        '201':
          description: Config successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Created Succefully"
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    $ref: "#/components/schemas/AppClientModel"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '204':
          $ref: "#/components/responses/204"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

  /app_clients/{client_name}:
    get:
      tags:
        - Apps
      summary: Gets a client application, its permissions and services
      security:
        - token_jws: []
      parameters:
        - $ref: "#/components/parameters/path_client_name"
        - $ref: "#/components/parameters/content_type"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Request Succefully"
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    $ref: "#/components/schemas/AppClientModel"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '204':
          $ref: "#/components/responses/204"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

    put:
      tags:
        - Apps
      summary: Update a client application, its permissions and services
      security:
        - token_jws: []
      parameters:
        - $ref: "#/components/parameters/content_type"
        - name: client_name
          in: path
          example: arcs-admin-web
          description: Unique name of the client application
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                  name:
                    type: string
                    description: "Unique name of the app client."
                  image:
                    nullable: true
                    type: string
                    format: base64
                    description: "image of app_client in base64"
                  name_friendly:
                    type: string
                    nullable: true
                    description: "A user-friendly name for the app client."
                  description:
                    type: string
                    nullable: true
                    description: "Description of the app client."

      responses:
        '200':
          description: Config successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Request Successfully"
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    $ref: "#/components/schemas/AppClientModel"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '204':
          $ref: "#/components/responses/204"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

    delete:
      tags:
        - Apps
      summary: Update config of profile in application
      security:
        - token_jws: []
      parameters:
        - $ref: "#/components/parameters/content_type"
        - name: client_name
          in: path
          example: arcs-admin-web
          description: Unique name of the client application
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Config successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Contract updated successfully"
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    $ref: "#/components/schemas/AppClientModel"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '204':
          $ref: "#/components/responses/204"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

  /app_clients/{client_name}/profile_config:
    get:
      tags:
        - Config
      summary: Get config of profile in application
      security:
        - token_jws: []
      parameters:
        - name: client_name
          in: path
          example: arcs-admin-web
          description: Unique name of the client application
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/content_type"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "SUCCESS"
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    $ref: "#/components/schemas/ConfigModel"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '204':
          $ref: "#/components/responses/204"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

    post:
      tags:
        - Config
      summary: Create config of profile in application
      security:
        - token_jws: []
      parameters:
        - name: client_name
          in: path
          example: arcs-admin-web
          description: Unique name of the client application
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/content_type"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/arcs_Config"
      responses:
        '201':
          description: Config successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Contract created successfully"
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    allOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          profile_id:
                            type: string
                            format: uuid
                          client_name:
                            type: string
                            example: arcs-admin-web
                      - $ref: "#/components/schemas/arcs_Config"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '204':
          $ref: "#/components/responses/204"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

    put:
      tags:
        - Config
      summary: Update config of profile in application
      security:
        - token_jws: []
      parameters:
        - name: client_name
          in: path
          example: arcs-admin-web
          description: Unique name of the client application
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/content_type"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/arcs_Config"
      responses:
        '201':
          description: Config successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Contract updated successfully"
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    allOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          profile_id:
                            type: string
                            format: uuid
                          client_name:
                            type: string
                            example: arcs-admin-web
                      - $ref: "#/components/schemas/arcs_Config"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '204':
          $ref: "#/components/responses/204"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

  /app_clients/{client_name}/envs/:
    get:
      tags:
        - Apps
      summary: Gets a client application environments
      security:
        - token_jws: [ ]
      parameters:
        - $ref: "#/components/parameters/path_client_name"
        - $ref: "#/components/parameters/content_type"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Request Successfully"
                  errors:
                    type: array
                    items:
                      type: string
                    example: [ ]
                  data:
                    $ref: "#/components/schemas/AppClientEnvsModel"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '500':
          $ref: "#/components/responses/500"

  /auth/:
    post:
      tags:
        - Auth
      summary: Authenticate using email and password
      description: Validates user credentials and generates a JWT token.
      parameters:
        - $ref: "#/components/parameters/content_type"
        - in: header
          name: X-App-Client
          required: true
          example: "arcs_admin_web"
          schema:
            type: string
          description: Name of the app client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email of the user
                  example: "user@example.com"
                password:
                  type: string
                  description: Password for the user's account
                  example: "securePassword123"
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Contract created successfully"
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    type: object
                    properties:
                      user_guest_id:
                        type: string
                        format: uuid
                        nullable: true
                        description: Optional guest user identifier
                      required_register:
                        type: boolean
                        description: Indicates if additional registration steps are required
                      token:
                        type: string
                        description: JWT token for authenticated sessions
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/hateoas"
        '204':
          $ref: "#/components/responses/204"
        '400':
          $ref: "#/components/responses/400"
        '401':
          $ref: "#/components/responses/401"
        '500':
          $ref: "#/components/responses/500"

  /auth/{provider_name}:
    post:
      tags:
        - Auth
      summary: Authenticate using provider-based credentials
      description: Validates a provider's token and generates a JWT token for the user.
      parameters:
        - in: header
          name: X-App-Client
          required: true
          example: "arcs_admin_web"
          schema:
            type: string
          description: Name of the app client
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            enum:
              - application/json
              - multipart/form-data
          description: The media type of the request body. Must be `application/json`.
        - in: path
          name: provider_name
          required: true
          schema:
            type: string
            enum:
              - MICROSOFT
              - GOOGLE
              - APPLE
          description: Name of the authentication provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
