          description: "Successful operation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type: number
                    example: 201
                  data:
                    $ref: "#/components/schemas/KeyContactRole"
                  message:
                    type: string
                    example: "Successful operation"
                  errors:
                    type: object
                  links:
                    $ref: "#/components/schemas/hateoas"
        400:
          $ref: "#/components/responses/400"
        401:
          $ref: "#/components/responses/401"
        500:
          $ref: "#/components/responses/500"

  /key_contacts/roles/{key_contact_role_id}:
    put:
      tags:
