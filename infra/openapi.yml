openapi: '3.0.3'
info:
  title: ARCS Service
  version: '1.0'
servers:
  - url: http://localhost:5000
    description: Localhost (desenvolvimento)
  - url: http://localhost:8080/arcs
    description: docker-compose (desenvolvimento)
tags:
