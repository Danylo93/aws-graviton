components:
  schemas:
    ###############################
    # arcs-lib-pca
    ###############################
    lib_Entity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          title: Datetime when the entity was created
          type: string
          format: date-time
        updatedAt:
          title: Datetime when the entity was updated
          type: string
          format: date-time
        deletedAt:
          title: Datetime when the entity was deleted
          type: string

    ###############################
    # arcs-service
    ###############################
    arcs_Config:
      type: object
      properties:
        allowNotifications:
          type: boolean
          default: true
        faceId:
          type: boolean
          default: false
        biometrics:
          type: boolean
          default: false
        location:
          type: boolean
          default: true

    ###############################
    # notify-service
    ###############################
    notify_Notification:
      type: object
      allOf:
        - $ref: "#/components/schemas/lib_Entity"
        - type: object
          properties:
            title:
              type: string
              description: Title of the notification
            description:
              type: string
              description: Detailed description of the notification
            category:
              type: string
              enum:
                - avaria
                - comunicado
                - contrato
                - etapa
              description: Category of the notification
            date:
              type: string
              format: date-time
              description: Date and time when the notification was created
            read:
              type: boolean
              description: Indicator if the notification has been read
            confirmed:
              type: boolean
              description: Indicator if the notification has been confirmed
              nullable: true

    pagination_without_items:
      type: object
      properties:
        total_items:
          type: integer
          description: "Total number of items."
        total_pages:
          type: integer
          description: "Total number of pages."
        current_page:
          type: integer
          description: "The current page number."
        per_page:
          type: integer
          description: "Number of items per page."
        has_next:
          type: boolean
          description: "Indicates if there is a next page."
        has_prev:
          type: boolean
          description: "Indicates if there is a previous page."
        next_page:
          type: integer
          nullable: true
          description: "The next page number, if available."
        prev_page:
          type: integer
          nullable: true
          description: "The previous page number, if available."

    BasePermissions:
      type: object
      description: "Base permissions for a microservice or controller"
      properties:
        name:
          type: string
          description: "Name of the microservice or controller"
        get:
          type: boolean
          default: false
          description: "Permission to GET resources in the controller"
        post:
          type: boolean
          default: false
          description: "Permission to POST resources in the controller"
        put:
          type: boolean
          default: false
          description: "Permission to PUT or PATCH resources in the controller"
        delete:
          type: boolean
          default: false
          description: "Permission to DELETE resources in the controller"

    PersonBase:
      type: object
      required:
        - full_name
        - first_name
        - last_name
      properties:
        full_name:
          type: string
          description: "Full name of the person."
          minLength: 2
        first_name:
          type: string
          description: "First name of the person."
          minLength: 1
        last_name:
          type: string
          description: "Last name of the person."
          minLength: 1
        identification:
          type: string
          nullable: true
          description: "Identification document number."
        status:
          type: string
          nullable: true
          description: "Current status of the person."
          default: "active"
        pronoun:
          type: string
          nullable: true
          description: "Pronoun used by the person."
        social_name:
          type: string
          nullable: true
          description: "Social name of the person."
        birth_date:
          type: string
          format: date
          nullable: true
          description: "Date of birth."
        doc:
          type: string
          nullable: true
          description: "Additional document information."
        reg_doc:
          type: string
          nullable: true
          description: "Registration document."
        passport:
          type: string
          nullable: true
          description: "Passport number."
        birth_place:
          type: string
          nullable: true
          description: "Place of birth."
        blood_type:
          type: string
          nullable: true
          description: "Blood type."
        medical_agreement:
          type: string
          nullable: true
          description: "Medical agreement or insurance information."
        weight:
          type: number
          format: float
          nullable: true
          description: "Weight in kilograms."
          default: 0.0
          minimum: 0
        height:
          type: number
          format: float
          nullable: true
          description: "Height in meters."
          default: 0.0
          minimum: 0
        shirt_size:
          type: string
          nullable: true
          description: "Shirt size."
        shoe_size:
          type: integer
          nullable: true
          description: "Shoe size."
          default: 40
          minimum: 1
        cba_card_code:
          type: string
          nullable: true
          description: "CBA card code."
        cba_card_type_id:
          type: string
          format: uuid
          nullable: true
          description: "Foreign key to CBA card type."
        fia_card:
          type: string
          nullable: true
          description: "FIA card number."
        fia_card_type_id:
          type: string
          format: uuid
          nullable: true
          description: "Foreign key to FIA card type."

    ProfileRequest:
      type: object
      properties:
        description:
          type: string
          nullable: true
          description: "Description of profile."
        pictures:
          $ref: "#/components/schemas/ProfilePictureRequest"
          nullable: true
          description: "Image of profile."
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/ProfilePermission"
          nullable: true
          description: "Permissions of profile."

    ProfilePermission:
      type: object
      properties:
        service:
          $ref: "#/components/schemas/BasePermissions"
          description: "Microservice access permissions."
        controllers:
          type: array
          items:
            $ref: "#/components/schemas/BasePermissions"
          description: "List of controllers identified by their namespace and respective access rules."

    SubGroupPermission:
      type: object
      properties:
        service:
          $ref: '#/components/schemas/BasePermissions'
          description: Microservice access permissions
        controllers:
          type: array
          items:
            $ref: '#/components/schemas/BasePermissions'
          description: List of controllers identified by their namespace and respective access rules
      required:
        - service
        - controllers

    ProfilePictureRequest:
      type: object
      description: "A dictionary where the key is defined by the requester, and the value is a base64-encoded image."
      additionalProperties:
        type: string
        format: base64
        description: "Profile image encoded in base64."

    ProfilePictureResponse:
      type: object
      description: "A dictionary where the key is defined by the requester, and the value is a base64-encoded image."
      additionalProperties:
        type: object
        properties:
          id:
            type: string
            format: uuid
            description: "Unique file identificator"
          url:
            type: string
            format: base64
            description: "Profile image encoded in base64."

    AccessProfilePicture:
        $ref: "#/components/schemas/ProfilePictureResponse"

    ContactsRequest:
      type: object
      properties:
        contact_type_id:
          type: string
          format: uuid
          nullable: true
          description: "Id of contact type."
        contact_type_name:
          type: string
          nullable: true
          description: "Name of contact type."
        name:
          type: string
          description: "Name of contact."
        value:
          type: string
          description: "Value of contact."
        is_emergency:
          type: boolean
          default: false
          description: "Emergency contact."
        is_main:
          type: boolean
          default: false
          description: "Main contact."
        is_verified:
          type: boolean
          default: false
          description: "Verified contact."

    AdressRequest:
      type: object
      properties:
        cep:
          type: string
          nullable: false
          description: "Postal code (CEP) of the address."
        address:
          type: string
          description: "Street address."
        code_address:
          type: string
          nullable: true
          description: "Optional code for identifying the address."
        neighborhood:
          type: string
          nullable: true
          description: "Neighborhood of the address."
        city:
          type: string
          description: "City where the address is located."
        state:
          type: string
          description: "State where the address is located."
        country:
          type: string
          description: "Country where the address is located."

    AccessProfileModel:
      type: object
      properties:
        profile_id:
          type: string
          format: uuid
          description: "Profile ID (UUID)"
        profile_picture:
          $ref: "#/components/schemas/AccessProfilePicture"
        user_id:
          type: string
          format: uuid
          description: "User ID (UUID)"
          uniqueItems: true
        user_object_id:
          type: string
          nullable: true
          description: "Optional object ID for user"
        email:
          type: string
          format: email
          description: "User's email"
        person_id:
          type: string
          format: uuid
          description: "Person ID (UUID)"
          uniqueItems: true
        name:
          type: string
          description: "User's full name"
        group_id:
          type: string
          format: uuid
          description: "Group ID (UUID)"
          uniqueItems: true
        group_name:
          type: string
          description: "Group name"
        group_object_id:
          type: string
          nullable: true
          description: "Optional object ID for group"
        subgroup_id:
          type: string
          format: uuid
          description: "Subgroup ID (UUID)"
          uniqueItems: true
        subgroup_name:
          type: string
          description: "Subgroup name"
        meta_data:
          type: object
          nullable: true
          description: "Meta data associated with the access profile"
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp when the profile was last updated"
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp when the profile was last updated"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp when the profile was last updated"

    AddressModel:
      type: object
      description: "Represents a physical address associated with a person."
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the address."
        person_id:
          type: string
          format: uuid
          description: "ID of the person associated with the address."
        cep:
          type: string
          nullable: true
          description: "Postal code (CEP) of the address."
        address:
          type: string
          description: "Street address."
        code_address:
          type: string
          nullable: true
          description: "Optional code for identifying the address."
        neighborhood:
          type: string
          nullable: true
          description: "Neighborhood of the address."
        city:
          type: string
          description: "City where the address is located."
        state:
          type: string
          description: "State where the address is located."
        country:
          type: string
          description: "Country where the address is located."
        created_at:
          type: string
          format: date-time
          description: "Timestamp of when the address was created."
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp of the last update, if applicable."

    AppClientGroupsPermissionsModelWithoutRelationships:
      type: object
      description: "Represents a permission associated with an app client and group."
      properties:
        app_client_id:
          type: string
          format: uuid
          description: "ID of the associated app client."
        group_id:
          type: string
          format: uuid
          description: "ID of the associated group."
        get:
          type: boolean
          default: false
          description: "Permission to perform GET operations."
        post:
          type: boolean
          default: false
          description: "Permission to perform POST operations."
        put:
          type: boolean
          default: false
          description: "Permission to perform PUT operations."
        delete:
          type: boolean
          default: false
          description: "Permission to perform DELETE operations."
        created_at:
          type: string
          format: date-time
          description: "Timestamp of when the permission record was created."
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp of the last update, if applicable."
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp of when the permission record was deleted."

    AppClientGroupsPermissionsModel:
      allOf:
        - $ref: "#/components/schemas/AppClientGroupsPermissionsModel"
        - type: object
          description: "Represents a permission associated with an app client and group."
          properties:
            app_client:
              $ref: "#/components/schemas/AppClientModel"
              description: "Details of the associated app client."
            group:
              $ref: "#/components/schemas/GroupModel"
              description: "Details of the associated group."

    UserData:
      type: object
      description: "Represents all relevant informations of a profile"
      properties:
        email:
          type: string
          format: email
          description: "User's email"
        person:
          $ref: "#/components/schemas/PersonModel"
        profile:
          $ref: "#/components/schemas/ProfileModel"
        access_profile:
          $ref: "#/components/schemas/AccessProfileModel"
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactModel"
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/AddressModel"
        pilot:
          $ref: "#/components/schemas/PilotModel"
        config:
          $ref: "#/components/schemas/ConfigModel"

    AppClientModel:
      type: object
      description: "Represents an app client."
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the app client."
        name:
          type: string
          description: "Unique name of the app client."
        image_id:
          type: string
          format: uuid
          nullable: true
          description: "Foreign key referencing the image (FileModel)."
        image:
          type: string
          format: uri
          example: /blob/container/file.png
          description: URI of the file stored on Azure Storage
        name_friendly:
          type: string
          description: "A user-friendly name for the app client."
        description:
          type: string
          nullable: true
          description: "Description of the app client."
        created_at:
          type: string
          format: datetime
          nullable: false
          description: "Datetime when the record was created"
        updated_at:
          type: string
          format: datetime
          nullable: true
          description: "Datetime when the record was updated"
        deleted_at:
          type: string
          format: datetime
          nullable: true
          description: "Datetime when the record was deleted"
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceModelWithoutRelationships"
        permissions:
          $ref: "#/components/schemas/PermissionModelWithoutRelationships"
        app_client_groups_permissions:
          $ref: "#/components/schemas/AppClientGroupsPermissionsModelWithoutRelationships"

    AppClientEnvsModel:
      type: object
      description: "Represents environment variables for an app client."
      properties:
        prod:
          type: object
          description: "Indicates if the environment is production."
        hml:
          type: object
          description: "Indicates if the environment is for testing or staging."
        dev:
          type: object
          description: "Indicates if the environment is for development."

    ConfigModel:
      type: object
      description: "Represents configuration settings for a client profile."
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the configuration."
        profile_id:
          type: string
          format: uuid
          description: "Foreign key referencing the access profile."
        profile:
          $ref: "#/components/schemas/ProfileModel"
          description: "Details of the associated access profile."
        client_name:
          type: string
          description: "Client name for the configuration."
        allow_notifications:
          type: boolean
          default: true
          description: "Indicates if notifications are allowed."
        face_id:
          type: boolean
          default: true
          description: "Indicates if face ID is enabled."
        biometrics:
          type: boolean
          default: true
          description: "Indicates if biometrics is enabled."
        location:
          type: boolean
          default: true
          description: "Indicates if location tracking is enabled."
        created_at:
          type: string
          format: date-time
          description: "Datetime when the record was created."
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: "Datetime when the record was updated."
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: "Datetime when the record was deleted."

    ContactModel:
      type: object
      description: "Represents a contact associated with a person, including type and verification status."
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the contact."
        contact_type_id:
          type: string
          format: uuid
          description: "Foreign key referencing the type of contact."
        contact_type:
          $ref: "#/components/schemas/ContactTypeModel"
          description: "Details of the associated contact type."
        person_id:
          type: string
          format: uuid
          description: "Foreign key referencing the associated person."
        name:
          type: string
          description: "Name of the contact."
        value:
          type: string
          description: "Value of the contact (e.g., email or phone number)."
        is_emergency:
          type: boolean
          default: false
          description: "Indicates if this contact is for emergency use."
        is_main:
          type: boolean
          default: false
          description: "Indicates if this is the primary contact."
        is_verified:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp indicating when the contact was verified, if applicable."
        created_at:
          type: string
          format: date-time
          description: "Datetime when the record was created."
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: "Datetime when the record was updated."
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: "Datetime when the record was deleted."

    ContactTypeModel:
      type: object
      description: "Represents the type of contact, including metadata like icon and description."
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the contact type."
        type_contact:
          type: string
          description: "Type of contact (e.g., email, phone, etc.)."
        icon:
          type: string
          nullable: true
          description: "URL or path for the icon representing the contact type."
        description:
          type: string
          nullable: true
          description: "Detailed description of the contact type."
        created_at:
          type: string
          format: date-time
          description: "Datetime when the record was created."
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: "Datetime when the record was updated."
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: "Datetime when the record was deleted."

    CBACardTypeModel:
      type: object
      description: "Represents a type of FIA card, including metadata like type and description."
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the FIA card type."
        type:
          type: string
          description: "Type of FIA card (e.g., license type, category)."
        description:
          type: string
          nullable: true
          description: "Optional description providing details about the card type."
        created_at:
          type: string
          format: date-time
          description: "Datetime when the record was created."
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: "Datetime when the record was last updated."
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: "Datetime when the record was deleted."

    FIACardTypeModel:
      type: object
      description: "Represents a type of FIA card, including metadata like type and description."
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the FIA card type."
        type:
          type: string
          description: "Type of FIA card (e.g., license type, category)."
        description:
          type: string
          nullable: true
          description: "Optional description providing details about the card type."
        created_at:
          type: string
          format: date-time
          description: "Datetime when the record was created."
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: "Datetime when the record was last updated."
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: "Datetime when the record was deleted."

    PilotModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the pilot."
        profile_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        name:
          type: string
        identifier:
          type: string
          example: "100"
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        bop:
          type: number
          example: 73.5
        person:
          $ref: "#/components/schemas/PersonModel"

    GroupModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the group."
        name:
          type: string
          description: "Name of the group."
        description:
          type: string
          nullable: true
          description: "Optional description of the group."
        image_id:
          type: string
          format: uuid
          nullable: true
          description: "Foreign key referencing the image related to the group."
        image:
