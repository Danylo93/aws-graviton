name: Build, Deploy and Settings

on:
  push:
    branches: [ hml2 ]
    paths:
      - '**'
      - '.github/workflows/build-deploy-hml2.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-hml2]

env:
  CONTAINER_APP_NAME: "${{ github.event.repository.name }}-hml2"
  CONTAINER_PORT: 8000

jobs:
  build:
    runs-on: ubuntu-latest
    environment: HML2
    permissions: 
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_HML2 }}

      - name: Load App Configuration
        run: |
          APP_CONFIG_NAME="appconfig-arcs-porschecup-hml2"
          
          get_config_value() {
            local key=$1
            local secret_fallback=$2
            
            # Tentar ler do App Config
            KV_REF=$(az appconfig kv show --name "$APP_CONFIG_NAME" --key "$key" --label "backend" -o json 2>/dev/null || \
                     az appconfig kv show --name "$APP_CONFIG_NAME" --key "$key" -o json 2>/dev/null)
            
            if [ -n "$KV_REF" ]; then
              # Verificar se é referência do Key Vault
              CONTENT_TYPE=$(echo "$KV_REF" | jq -r '.contentType // ""' 2>/dev/null)
              if [[ "$CONTENT_TYPE" == *"keyvaultref"* ]]; then
                # É referência do Key Vault, extrair URI e buscar o valor
                KV_URI=$(echo "$KV_REF" | jq -r '.value.uri // .value // ""' 2>/dev/null)
                if [ -n "$KV_URI" ]; then
                  # Extrair nome do secret da URI (última parte após /secrets/)
                  SECRET_NAME=$(echo "$KV_URI" | sed 's|.*/secrets/||' | sed 's|/.*||')
                  VAULT_NAME=$(echo "$KV_URI" | sed 's|https://||' | sed 's|\.vault\.azure\.net.*||')
                  # Buscar valor do Key Vault
                  KV_VALUE=$(az keyvault secret show --vault-name "$VAULT_NAME" --name "$SECRET_NAME" --query "value" -o tsv 2>/dev/null)
                  if [ -n "$KV_VALUE" ]; then
                    echo "$KV_VALUE"
                    return
                  fi
                fi
              else
                # Valor direto do App Config
                APP_VALUE=$(echo "$KV_REF" | jq -r '.value // ""' 2>/dev/null)
                if [ -n "$APP_VALUE" ]; then
                  echo "$APP_VALUE"
                  return
                fi
              fi
            fi
            
            # Fallback para GitHub Secret
            echo "$secret_fallback"
          }
          
          echo "ACR_NAME_HML2=$(get_config_value "ACR_NAME_HML2" "${{ secrets.ACR_NAME_HML2 }}")" >> $GITHUB_ENV
          echo "AZURE_SUBSCRIPTION_ID=$(get_config_value "AZURE_SUBSCRIPTION_ID_HML2" "${{ secrets.AZURE_SUBSCRIPTION_ID }}")" >> $GITHUB_ENV
          echo "RG_NAME_ARCS_HML2=$(get_config_value "RG_NAME_ARCS_HML2" "${{ secrets.RG_NAME_ARCS_HML2 }}")" >> $GITHUB_ENV

      - name: Configure Azure CLI
        run: |
          az acr login --name ${{ env.ACR_NAME_HML2 }}
          az account set -s ${{ env.AZURE_SUBSCRIPTION_ID }}
          az configure --defaults group=${{ env.RG_NAME_ARCS_HML2 }}
      
      - name: Generate .env File
        env:
          REMOVE_SUFIX: _HML
        run: |
          source ./infra/arcs.sh
          convert_json_to_env '${{ toJSON(secrets) }}'
          convert_json_to_env '${{ toJSON(vars) }}'
          convert_json_to_env '${{ toJSON(env) }}'
      
      - name: Build and push image
        run: |
          docker build \
            --build-arg TOKEN_PKG_LIB_GITHUB=${{ secrets.TOKEN_PKG_LIB_GITHUB }} \
            -t ${{ env.ACR_NAME_HML2 }}.azurecr.io/${{ github.event.repository.name }}:${{ github.sha }} \
            -f ./infra/Dockerfile.hml2 .
          docker push ${{ env.ACR_NAME_HML2 }}.azurecr.io/${{ github.event.repository.name }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: HML2
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_HML2 }}

      - name: Load App Configuration
        run: |
          APP_CONFIG_NAME="appconfig-arcs-porschecup-hml2"
          MS_NAME="${{ github.event.repository.name }}"
          
          get_config_value() {
            local key=$1
            local secret_fallback=$2
            
            # Tentar ler do App Config
            KV_REF=$(az appconfig kv show --name "$APP_CONFIG_NAME" --key "$key" --label "backend" -o json 2>/dev/null || \
                     az appconfig kv show --name "$APP_CONFIG_NAME" --key "$key" -o json 2>/dev/null)
            
            if [ -n "$KV_REF" ]; then
              # Verificar se é referência do Key Vault
              CONTENT_TYPE=$(echo "$KV_REF" | jq -r '.contentType // ""' 2>/dev/null)
              if [[ "$CONTENT_TYPE" == *"keyvaultref"* ]]; then
                # É referência do Key Vault, extrair URI e buscar o valor
                KV_URI=$(echo "$KV_REF" | jq -r '.value.uri // .value // ""' 2>/dev/null)
                if [ -n "$KV_URI" ]; then
                  # Extrair nome do secret da URI (última parte após /secrets/)
                  SECRET_NAME=$(echo "$KV_URI" | sed 's|.*/secrets/||' | sed 's|/.*||')
                  VAULT_NAME=$(echo "$KV_URI" | sed 's|https://||' | sed 's|\.vault\.azure\.net.*||')
                  # Buscar valor do Key Vault
                  KV_VALUE=$(az keyvault secret show --vault-name "$VAULT_NAME" --name "$SECRET_NAME" --query "value" -o tsv 2>/dev/null)
                  if [ -n "$KV_VALUE" ]; then
                    echo "$KV_VALUE"
                    return
                  fi
                fi
              else
                # Valor direto do App Config
                APP_VALUE=$(echo "$KV_REF" | jq -r '.value // ""' 2>/dev/null)
                if [ -n "$APP_VALUE" ]; then
                  echo "$APP_VALUE"
                  return
                fi
              fi
            fi
            
            # Fallback para GitHub Secret
            echo "$secret_fallback"
          }
          
          AZURE_SUBSCRIPTION_ID=$(get_config_value "AZURE_SUBSCRIPTION_ID_HML2" "${{ secrets.AZURE_SUBSCRIPTION_ID }}")
          RG_NAME_ARCS_HML2=$(get_config_value "RG_NAME_ARCS_HML2" "${{ secrets.RG_NAME_ARCS_HML2 }}")
          ARCS_ENV_APP_HML2=$(get_config_value "ARCS_ENV_APP_HML2" "${{ secrets.ARCS_ENV_APP_HML2 }}")
          ACR_NAME_HML2=$(get_config_value "ACR_NAME_HML2" "${{ secrets.ACR_NAME_HML2 }}")
          ACR_USERNAME_HML2=$(get_config_value "ACR_USERNAME_HML2" "${{ secrets.ACR_USERNAME_HML2 }}")
          ACR_PASSWORD_HML2=$(get_config_value "ACR_PASSWORD_HML2" "${{ secrets.ACR_PASSWORD_HML2 }}")
          STORAGE_NAME_HML2=$(get_config_value "STORAGE_NAME_HML2" "${{ secrets.STORAGE_NAME_HML2 }}")
          ARCS_KV_NAME_HML2=$(get_config_value "ARCS_KV_NAME_HML2" "${{ secrets.ARCS_KV_NAME_HML2 }}")
          ARCS_POSTGRES_SERVER_HML2=$(get_config_value "ARCS_POSTGRES_SERVER_HML2" "${{ secrets.ARCS_POSTGRES_SERVER_HML2 }}")
          POSTGRES_DB_HML2=$(get_config_value "${MS_NAME}:POSTGRES_DB_HML2" "") || \
          POSTGRES_DB_HML2=$(get_config_value "POSTGRES_DB_HML2" "${{ secrets.POSTGRES_DB_HML2 }}")
          POSTGRES_PASSWORD_HML2=$(get_config_value "POSTGRES_PASSWORD_HML2" "${{ secrets.POSTGRES_PASSWORD_HML2 }}")
          ARCS_PUBSUB_HML2=$(get_config_value "ARCS_PUBSUB_HML2" "${{ secrets.ARCS_PUBSUB_HML2 }}")
          REDIS_PASSWORD_HML2=$(get_config_value "REDIS_PASSWORD_HML2" "${{ secrets.REDIS_PASSWORD_HML2 }}")
          APIM_NAME_HML2=$(get_config_value "APIM_NAME_HML2" "${{ secrets.APIM_NAME_HML2 }}")
          AZURE_MANAGED_IDENTITY_NAME_HML2=$(get_config_value "AZURE_MANAGED_IDENTITY_NAME_HML2" "${{ secrets.AZURE_MANAGED_IDENTITY_NAME_HML2 }}")
          AZURE_CLIENT_ID_HML2=$(get_config_value "AZURE_CLIENT_ID_HML2" "${{ secrets.AZURE_CLIENT_ID_HML2 }}")
          # AZURE_CLIENT_SECRET_HML2 está no Key Vault, buscar diretamente (usar variável local já carregada)
          AZURE_CLIENT_SECRET_HML2=$(az keyvault secret show --vault-name "$ARCS_KV_NAME_HML2" --name "AZURE-CLIENT-SECRET-HML2" --query value -o tsv 2>/dev/null || echo "${{ secrets.AZURE_CLIENT_SECRET_HML2 }}")
          AZURE_CLIENT_OBJECT_ID_HML2=$(get_config_value "AZURE_CLIENT_OBJECT_ID_HML2" "${{ secrets.AZURE_CLIENT_OBJECT_ID_HML2 }}")
          
          echo "AZURE_SUBSCRIPTION_ID=$AZURE_SUBSCRIPTION_ID" >> $GITHUB_ENV
          echo "RG_NAME_ARCS_HML2=$RG_NAME_ARCS_HML2" >> $GITHUB_ENV
          echo "ARCS_ENV_APP_HML2=$ARCS_ENV_APP_HML2" >> $GITHUB_ENV
          echo "ACR_NAME_HML2=$ACR_NAME_HML2" >> $GITHUB_ENV
          echo "ACR_USERNAME_HML2=$ACR_USERNAME_HML2" >> $GITHUB_ENV
          echo "ACR_PASSWORD_HML2=$ACR_PASSWORD_HML2" >> $GITHUB_ENV
          echo "STORAGE_NAME_HML2=$STORAGE_NAME_HML2" >> $GITHUB_ENV
          echo "ARCS_KV_NAME_HML2=$ARCS_KV_NAME_HML2" >> $GITHUB_ENV
          echo "ARCS_POSTGRES_SERVER_HML2=$ARCS_POSTGRES_SERVER_HML2" >> $GITHUB_ENV
          echo "POSTGRES_DB_HML2=$POSTGRES_DB_HML2" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD_HML2=$POSTGRES_PASSWORD_HML2" >> $GITHUB_ENV
          echo "ARCS_PUBSUB_HML2=$ARCS_PUBSUB_HML2" >> $GITHUB_ENV
          echo "REDIS_PASSWORD_HML2=$REDIS_PASSWORD_HML2" >> $GITHUB_ENV
          echo "APIM_NAME_HML2=$APIM_NAME_HML2" >> $GITHUB_ENV
          echo "AZURE_MANAGED_IDENTITY_NAME_HML2=$AZURE_MANAGED_IDENTITY_NAME_HML2" >> $GITHUB_ENV
          echo "AZURE_CLIENT_ID_HML2=$AZURE_CLIENT_ID_HML2" >> $GITHUB_ENV
          echo "AZURE_CLIENT_SECRET_HML2=$AZURE_CLIENT_SECRET_HML2" >> $GITHUB_ENV
          echo "AZURE_CLIENT_OBJECT_ID_HML2=$AZURE_CLIENT_OBJECT_ID_HML2" >> $GITHUB_ENV
          echo "AZURE_PATH_PROVIDERS=/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG_NAME_ARCS_HML2/providers" >> $GITHUB_ENV
          echo "CONTAINER_APP_SOURCE_ID=/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG_NAME_ARCS_HML2/providers/Microsoft.App/containerApps/${{ github.event.repository.name }}-hml2" >> $GITHUB_ENV
          
      - name: Configure Azure CLI
        run: |
          az acr login --name ${{ env.ACR_NAME_HML2 }}
          az account set -s ${{ env.AZURE_SUBSCRIPTION_ID }}
          az configure --defaults group=${{ env.RG_NAME_ARCS_HML2 }}
          az extension add --name containerapp --upgrade
          # Remover extensão problemática que interfere na criação de conexões
          az extension remove --name serviceconnector-passwordless 2>/dev/null || true

      - name: Verify prerequisites
        run: |
          if az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --query 'properties.provisioningState' -o tsv 2>/dev/null; then
            echo "aca_exists=true" >> $GITHUB_ENV
          else
            echo "aca_exists=false" >> $GITHUB_ENV
          fi
          
          if ! az redis show --name redis-arcs-porschecup-hml2 --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --query 'provisioningState' -o tsv 2>/dev/null; then
            echo "❌ Redis Cache does not exist"
            exit 1
          fi
          
          if ! az identity show --name "${{ env.AZURE_MANAGED_IDENTITY_NAME_HML2 }}" --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --query 'name' -o tsv 2>/dev/null; then
            echo "❌ Managed Identity '${{ env.AZURE_MANAGED_IDENTITY_NAME_HML2 }}' NOT FOUND"
            exit 1
          fi

      - name: Create Container App
        if: env.aca_exists == 'false'
        run: |
          az containerapp create \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RG_NAME_ARCS_HML2 }} \
            --environment ${{ env.ARCS_ENV_APP_HML2 }} \
            --image ${{ env.ACR_NAME_HML2 }}.azurecr.io/${{ github.event.repository.name }}:${{ github.sha }} \
            --ingress external \
            --registry-server ${{ env.ACR_NAME_HML2 }}.azurecr.io \
            --registry-username ${{ env.ACR_USERNAME_HML2 }} \
            --registry-password ${{ env.ACR_PASSWORD_HML2 }} \
            --user-assigned ${{ env.AZURE_PATH_PROVIDERS }}/Microsoft.ManagedIdentity/userAssignedIdentities/${{ env.AZURE_MANAGED_IDENTITY_NAME_HML2 }} \
            --target-port ${{ env.CONTAINER_PORT }} \
            --min-replicas 1 \
            --env-vars "REDIS_HOST=redis-arcs-porschecup-hml2.redis.cache.windows.net" "REDIS_PORT=6379" "REDIS_PASSWORD=${{ env.REDIS_PASSWORD_HML2 }}" "REDIS_SSL_PORT=6380" "MICROSERVICE_PORT=8000" \
            --secrets "priv-arcs-pem=keyvault:https://${{ env.ARCS_KV_NAME_HML2 }}.vault.azure.net/secrets/PRIV-ARCS-PEM"
          
          # Adicionar variável de ambiente que referencia o secret (após criar o secret)
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RG_NAME_ARCS_HML2 }} \
            --set-env-vars "PRIV_ARCS_PEM=secretref:priv-arcs-pem"
      
      - name: Update Container App
        if: env.aca_exists == 'true'
        run: |
          CURRENT_INGRESS=$(az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --query "properties.configuration.ingress.external" -o tsv 2>/dev/null || echo "false")
          
          if [ "$CURRENT_INGRESS" != "true" ]; then
            az containerapp ingress enable \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RG_NAME_ARCS_HML2 }} \
              --type external \
              --target-port ${{ env.CONTAINER_PORT }}
          fi
          
          # Atualizar imagem e variáveis de ambiente
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RG_NAME_ARCS_HML2 }} \
            --image ${{ env.ACR_NAME_HML2 }}.azurecr.io/${{ github.event.repository.name }}:${{ github.sha }} \
            --min-replicas 1 \
            --set-env-vars "REDIS_HOST=redis-arcs-porschecup-hml2.redis.cache.windows.net" "REDIS_PORT=6379" "REDIS_PASSWORD=${{ env.REDIS_PASSWORD_HML2 }}" "REDIS_SSL_PORT=6380"
  
          # Garantir que o secret existe
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RG_NAME_ARCS_HML2 }} \
            --secrets "priv-arcs-pem=keyvault:https://${{ env.ARCS_KV_NAME_HML2 }}.vault.azure.net/secrets/PRIV-ARCS-PEM" \
            --output none 2>/dev/null || true
          
          # Adicionar variável de ambiente que referencia o secret
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RG_NAME_ARCS_HML2 }} \
            --set-env-vars "PRIV_ARCS_PEM=secretref:priv-arcs-pem"
  
      - name: Assign managed identity
        run: |
          az containerapp identity assign \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RG_NAME_ARCS_HML2 }} \
            --user-assigned ${{ env.AZURE_PATH_PROVIDERS }}/Microsoft.ManagedIdentity/userAssignedIdentities/${{ env.AZURE_MANAGED_IDENTITY_NAME_HML2 }}

      - name: Wait for Container App ready
        run: |
          for i in {1..10}; do
            STATUS=$(az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --query 'properties.provisioningState' -o tsv 2>/dev/null || echo "Unknown")
            if [ "$STATUS" == "Succeeded" ]; then
              break
            fi
            sleep 15
          done
          
          if [ "$STATUS" != "Succeeded" ]; then
            echo "❌ Container App failed to reach 'Succeeded' status"
            az containerapp logs show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --tail 100
            exit 1
          fi

      - name: Setup managed connections
        run: |
          set +e
          SUB_ID="${{ env.AZURE_SUBSCRIPTION_ID }}"
          RG_NAME="${{ env.RG_NAME_ARCS_HML2 }}"
          CONTAINER_APP_NAME="${{ env.CONTAINER_APP_NAME }}"
          CONTAINER_APP_SOURCE_ID="${{ env.CONTAINER_APP_SOURCE_ID }}"
          APP_CONFIG_NAME="appconfig-arcs-porschecup-hml2"
          KV_NAME="${{ env.ARCS_KV_NAME_HML2 }}"
          MS_NAME="arcs-service"
          
          # Função para carregar valores do App Config/Key Vault
          get_config_value() {
            local key=$1
            local secret_fallback=$2
            
            # Tentar ler do App Config
            KV_REF=$(az appconfig kv show --name "$APP_CONFIG_NAME" --key "$key" --label "backend" -o json 2>/dev/null || \
                     az appconfig kv show --name "$APP_CONFIG_NAME" --key "$key" -o json 2>/dev/null)
            
            if [ -n "$KV_REF" ]; then
              # Verificar se é referência do Key Vault
              CONTENT_TYPE=$(echo "$KV_REF" | jq -r '.contentType // ""' 2>/dev/null)
              if [[ "$CONTENT_TYPE" == *"keyvaultref"* ]]; then
                # É referência do Key Vault, extrair URI e buscar o valor
                KV_URI=$(echo "$KV_REF" | jq -r '.value.uri // .value // ""' 2>/dev/null)
                if [ -n "$KV_URI" ]; then
                  # Extrair nome do secret da URI (última parte após /secrets/)
                  SECRET_NAME=$(echo "$KV_URI" | sed 's|.*/secrets/||' | sed 's|/.*||')
                  VAULT_NAME=$(echo "$KV_URI" | sed 's|https://||' | sed 's|\.vault\.azure\.net.*||')
                  # Buscar valor do Key Vault
                  KV_VALUE=$(az keyvault secret show --vault-name "$VAULT_NAME" --name "$SECRET_NAME" --query "value" -o tsv 2>/dev/null)
                  if [ -n "$KV_VALUE" ]; then
                    echo "$KV_VALUE"
                    return
                  fi
                fi
              else
                # Valor direto do App Config
                APP_VALUE=$(echo "$KV_REF" | jq -r '.value // ""' 2>/dev/null)
                if [ -n "$APP_VALUE" ]; then
                  echo "$APP_VALUE"
                  return
                fi
              fi
            fi
            
            # Fallback para GitHub Secret
            echo "$secret_fallback"
          }
          
          # Carregar secrets do service principal do App Config/Key Vault
          echo "📋 Carregando service principal credentials do App Config/Key Vault..."
          AZURE_CLIENT_ID=$(get_config_value "AZURE_CLIENT_ID_HML2" "${{ secrets.AZURE_CLIENT_ID_HML2 }}")
          # AZURE_CLIENT_SECRET_HML2 está no Key Vault, buscar diretamente
          AZURE_CLIENT_SECRET=$(az keyvault secret show --vault-name "$KV_NAME" --name "AZURE-CLIENT-SECRET-HML2" --query value -o tsv 2>/dev/null || echo "${{ secrets.AZURE_CLIENT_SECRET_HML2 }}")
          AZURE_CLIENT_OBJECT_ID=$(get_config_value "AZURE_CLIENT_OBJECT_ID_HML2" "${{ secrets.AZURE_CLIENT_OBJECT_ID_HML2 }}")
          
          # Se não tiver OBJECT_ID, obter do service principal
          if [ -z "$AZURE_CLIENT_OBJECT_ID" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            echo "📋 Obtendo OBJECT_ID do service principal via Azure AD..."
            AZURE_CLIENT_OBJECT_ID=$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv 2>/dev/null || echo "")
          fi
          
          # Verificar se os secrets estão disponíveis
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ]; then
            echo "⚠️  WARNING: Service principal credentials not available!"
            echo "   AZURE_CLIENT_ID_HML2: ${AZURE_CLIENT_ID:-NOT SET}"
            echo "   AZURE_CLIENT_SECRET_HML2: ${AZURE_CLIENT_SECRET:+SET}${AZURE_CLIENT_SECRET:-NOT SET}"
            echo "   PostgreSQL connection will be created with managed identity instead."
          else
            echo "✅ Service principal credentials available"
            echo "   AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:0:8}..."
            echo "   AZURE_CLIENT_OBJECT_ID: ${AZURE_CLIENT_OBJECT_ID:0:8}..."
          fi
          
          create_connection() {
            local conn_type=$1
            local conn_name=$2
            local target_id=$3
            local client_type=${4:-python}
            local extra_args=${5:-}
            
            # Verificar se conexão existe
            if az containerapp connection show --name "$CONTAINER_APP_NAME" --resource-group "$RG_NAME" --connection "$conn_name" --output none 2>/dev/null; then
              echo "✅ Connection $conn_name already exists, skipping..."
              return 0
            fi
            
            echo "🔗 Creating connection $conn_name..."
            
            # Se service principal está disponível, usar --service-principal
            if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
              if [ "$conn_type" == "postgres-flexible" ] && [ -n "$AZURE_CLIENT_OBJECT_ID" ]; then
                az containerapp connection create $conn_type \
                  --target-id "$target_id" \
                --source-id "$CONTAINER_APP_SOURCE_ID" \
                --container "$CONTAINER_APP_NAME" \
                  --connection "$conn_name" \
                  --client-type "$client_type" \
                  --service-principal client-id="$AZURE_CLIENT_ID" object-id="$AZURE_CLIENT_OBJECT_ID" secret="$AZURE_CLIENT_SECRET" \
                  $extra_args 2>&1
              else
                az containerapp connection create $conn_type \
                  --target-id "$target_id" \
                  --source-id "$CONTAINER_APP_SOURCE_ID" \
                  --container "$CONTAINER_APP_NAME" \
                  --connection "$conn_name" \
                  --client-type "$client_type" \
                  --service-principal client-id="$AZURE_CLIENT_ID" secret="$AZURE_CLIENT_SECRET" \
                  $extra_args 2>&1
              fi
            else
              # Fallback: criar sem service-principal
              az containerapp connection create $conn_type \
                --target-id "$target_id" \
                --source-id "$CONTAINER_APP_SOURCE_ID" \
                --container "$CONTAINER_APP_NAME" \
                --connection "$conn_name" \
                --client-type "$client_type" \
                $extra_args 2>&1
            fi
          }
          
          # Storage Blob
          create_connection "storage-blob" "arcsstorage" "/subscriptions/${SUB_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.Storage/storageAccounts/${{ env.STORAGE_NAME_HML2 }}/blobServices/default" "python" "--container $CONTAINER_APP_NAME"
          
          # Key Vault
          create_connection "keyvault" "arcs_kv" "/subscriptions/${SUB_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.KeyVault/vaults/${{ env.ARCS_KV_NAME_HML2 }}" "python"
          
          # PostgreSQL (formato igual ao HML)
          if ! az postgres flexible-server db show --resource-group "$RG_NAME" --server-name "${{ env.ARCS_POSTGRES_SERVER_HML2 }}" --database-name "${{ env.POSTGRES_DB_HML2 }}" --output none 2>/dev/null; then
            echo "📦 Creating PostgreSQL database ${{ env.POSTGRES_DB_HML2 }}..."
            az postgres flexible-server db create --resource-group "$RG_NAME" --server-name "${{ env.ARCS_POSTGRES_SERVER_HML2 }}" --database-name "${{ env.POSTGRES_DB_HML2 }}"
          fi
          
          # Criar conexão PostgreSQL com service-principal (formato exato do HML)
          # Verificar se conexão já existe
          if ! az containerapp connection show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --connection user_${{ env.POSTGRES_DB_HML2 }} --output none 2>/dev/null; then
            echo "🔗 Creating PostgreSQL connection user_${{ env.POSTGRES_DB_HML2 }}..."
            echo "   Using CLIENT_ID: ${AZURE_CLIENT_ID:0:8}..."
            echo "   Using OBJECT_ID: ${AZURE_CLIENT_OBJECT_ID:0:8}..."
            echo "   Using SECRET: ${AZURE_CLIENT_SECRET:+SET}${AZURE_CLIENT_SECRET:-NOT SET}"
            
            # Validar se todas as credenciais estão disponíveis
            if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ]; then
              echo "❌ Erro: AZURE_CLIENT_ID ou AZURE_CLIENT_SECRET não estão disponíveis"
              echo "   AZURE_CLIENT_ID length: ${#AZURE_CLIENT_ID}"
              echo "   AZURE_CLIENT_SECRET length: ${#AZURE_CLIENT_SECRET}"
              exit 1
            fi
            
            # Debug: verificar se as variáveis estão definidas
            echo "   Debug - CLIENT_ID definido: $([ -n "$AZURE_CLIENT_ID" ] && echo 'SIM' || echo 'NÃO')"
            echo "   Debug - SECRET definido: $([ -n "$AZURE_CLIENT_SECRET" ] && echo 'SIM' || echo 'NÃO')"
            echo "   Debug - OBJECT_ID definido: $([ -n "$AZURE_CLIENT_OBJECT_ID" ] && echo 'SIM' || echo 'NÃO')"
            
            # Criar conexão PostgreSQL
            if [ -n "$AZURE_CLIENT_OBJECT_ID" ]; then
              # Com OBJECT_ID
              az containerapp connection create postgres-flexible \
                --target-id ${{ env.AZURE_PATH_PROVIDERS }}/Microsoft.DBforPostgreSQL/flexibleServers/${{ env.ARCS_POSTGRES_SERVER_HML2 }}/databases/${{ env.POSTGRES_DB_HML2 }} \
                --source-id ${{ env.CONTAINER_APP_SOURCE_ID }} \
                --container ${{ env.CONTAINER_APP_NAME }} \
                --connection user_${{ env.POSTGRES_DB_HML2 }} \
                --client-type python \
                --service-principal client-id=$AZURE_CLIENT_ID object-id=$AZURE_CLIENT_OBJECT_ID secret=$AZURE_CLIENT_SECRET
            else
              # Sem OBJECT_ID
              az containerapp connection create postgres-flexible \
                --target-id ${{ env.AZURE_PATH_PROVIDERS }}/Microsoft.DBforPostgreSQL/flexibleServers/${{ env.ARCS_POSTGRES_SERVER_HML2 }}/databases/${{ env.POSTGRES_DB_HML2 }} \
                --source-id ${{ env.CONTAINER_APP_SOURCE_ID }} \
                --container ${{ env.CONTAINER_APP_NAME }} \
                --connection user_${{ env.POSTGRES_DB_HML2 }} \
                --client-type python \
                --service-principal client-id=$AZURE_CLIENT_ID secret=$AZURE_CLIENT_SECRET
            fi
          else
            echo "✅ PostgreSQL connection user_${{ env.POSTGRES_DB_HML2 }} already exists"
          fi
          
          # Configurar variáveis de ambiente do PostgreSQL (usando FQDN privado)
          # O Service Connector cria o usuário AAD como "aad_user_arcs_db" (baseado no connection name "user_arcs_db")
          # O Service Connector também cria automaticamente as variáveis:
          # - AZURE_POSTGRESQL_USER_ARCS_DB_CLIENTID
          # - AZURE_POSTGRESQL_USER_ARCS_DB_CLIENTSECRET
          # - AZURE_POSTGRESQL_USER_ARCS_DB_TENANTID
          # Não precisamos definir essas variáveis manualmente, o Service Connector já as cria
          POSTGRES_HOST="b83ac0e53ac6.private.postgres.database.azure.com"
          # Adicionar KEY_VAULT_NAME (necessário para arcs_lib_pca construir a URL automaticamente)
          az containerapp update --name "$CONTAINER_APP_NAME" --resource-group "$RG_NAME" --set-env-vars \
            POSTGRES_HOST="$POSTGRES_HOST" POSTGRES_PORT="5432" POSTGRES_DB="${{ env.POSTGRES_DB_HML2 }}" \
            POSTGRES_USER="${{ env.ARCS_POSTGRES_SERVER_HML2 }}-admin" POSTGRES_SSLMODE="require" \
            POSTGRES_AAD_USER="aad_user_${{ env.POSTGRES_DB_HML2 }}" \
            KEY_VAULT_NAME="${{ env.ARCS_KV_NAME_HML2 }}" \
              --output none
          
          # Web PubSub
          create_connection "webpubsub" "arcs_pubsub" "/subscriptions/${SUB_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.SignalRService/WebPubSub/${{ env.ARCS_PUBSUB_HML2 }}" "python"
          
          # Nota: Redis não é configurado via Service Connector no HML, então mantemos variáveis manuais
          # As variáveis AZURE_* serão criadas automaticamente pelo Service Connector acima
          
          set -e
      
  settings:
    needs: deploy
    runs-on: ubuntu-latest
    environment: HML2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_HML2 }}

      - name: Load App Configuration
        run: |
          APP_CONFIG_NAME="appconfig-arcs-porschecup-hml2"
          
          get_config_value() {
            local key=$1
            local secret_fallback=$2
            
            # Tentar ler do App Config
            KV_REF=$(az appconfig kv show --name "$APP_CONFIG_NAME" --key "$key" --label "backend" -o json 2>/dev/null || \
                     az appconfig kv show --name "$APP_CONFIG_NAME" --key "$key" -o json 2>/dev/null)
            
            if [ -n "$KV_REF" ]; then
              # Verificar se é referência do Key Vault
              CONTENT_TYPE=$(echo "$KV_REF" | jq -r '.contentType // ""' 2>/dev/null)
              if [[ "$CONTENT_TYPE" == *"keyvaultref"* ]]; then
                # É referência do Key Vault, extrair URI e buscar o valor
                KV_URI=$(echo "$KV_REF" | jq -r '.value.uri // .value // ""' 2>/dev/null)
                if [ -n "$KV_URI" ]; then
                  # Extrair nome do secret da URI (última parte após /secrets/)
                  SECRET_NAME=$(echo "$KV_URI" | sed 's|.*/secrets/||' | sed 's|/.*||')
                  VAULT_NAME=$(echo "$KV_URI" | sed 's|https://||' | sed 's|\.vault\.azure\.net.*||')
                  # Buscar valor do Key Vault
                  KV_VALUE=$(az keyvault secret show --vault-name "$VAULT_NAME" --name "$SECRET_NAME" --query "value" -o tsv 2>/dev/null)
                  if [ -n "$KV_VALUE" ]; then
                    echo "$KV_VALUE"
                    return
                  fi
                fi
              else
                # Valor direto do App Config
                APP_VALUE=$(echo "$KV_REF" | jq -r '.value // ""' 2>/dev/null)
                if [ -n "$APP_VALUE" ]; then
                  echo "$APP_VALUE"
                  return
                fi
              fi
            fi
            
            # Fallback para GitHub Secret
            echo "$secret_fallback"
          }
          
          echo "AZURE_SUBSCRIPTION_ID=$(get_config_value "AZURE_SUBSCRIPTION_ID_HML2" "${{ secrets.AZURE_SUBSCRIPTION_ID }}")" >> $GITHUB_ENV
          echo "RG_NAME_ARCS_HML2=$(get_config_value "RG_NAME_ARCS_HML2" "${{ secrets.RG_NAME_ARCS_HML2 }}")" >> $GITHUB_ENV
          echo "ARCS_ENV_APP_HML2=$(get_config_value "ARCS_ENV_APP_HML2" "${{ secrets.ARCS_ENV_APP_HML2 }}")" >> $GITHUB_ENV
          echo "APIM_NAME_HML2=$(get_config_value "APIM_NAME_HML2" "${{ secrets.APIM_NAME_HML2 }}")" >> $GITHUB_ENV
          echo "REDIS_PASSWORD_HML2=$(get_config_value "REDIS_PASSWORD_HML2" "${{ secrets.REDIS_PASSWORD_HML2 }}")" >> $GITHUB_ENV

      - name: Configure Azure CLI
        run: |
          az account set -s ${{ env.AZURE_SUBSCRIPTION_ID }}
          az configure --defaults group=${{ env.RG_NAME_ARCS_HML2 }}
          az extension add --name containerapp --upgrade
          az extension add --name apim --upgrade || true

      - name: Get Container App FQDN
        run: |
          FQDN=$(az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --query "properties.configuration.ingress.fqdn" -o tsv)
          
          if [ -z "$FQDN" ]; then
            echo "❌ Could not retrieve FQDN"
            exit 1
          fi
          
          echo "microservice_url=https://$FQDN" >> $GITHUB_ENV
          echo "MICROSERVICE_INTERNAL_URL=https://$FQDN" >> $GITHUB_ENV
          echo "ARCS_SERVICE_INTERNAL_URL=https://$FQDN" >> $GITHUB_ENV
          
          # Definir URL externa (usar APIM se disponível, senão usar URL interna)
          if [ -n "${{ env.APIM_NAME_HML2 }}" ]; then
            APIM_GATEWAY_URL=$(az apim show --name "${{ env.APIM_NAME_HML2 }}" --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --query "properties.gatewayUrl" -o tsv 2>/dev/null || echo "")
            if [ -n "$APIM_GATEWAY_URL" ]; then
              API_PATH="${{ vars.APIM_API_ROUTE_PATH }}"
              [ -z "$API_PATH" ] && API_PATH="/$(echo ${{ env.CONTAINER_APP_NAME }} | tr '[:upper:]' '[:lower:]')"
              echo "MICROSERVICE_EXTERNAL_URL=${APIM_GATEWAY_URL}${API_PATH}" >> $GITHUB_ENV
            else
              echo "MICROSERVICE_EXTERNAL_URL=https://$FQDN" >> $GITHUB_ENV
            fi
          else
            echo "MICROSERVICE_EXTERNAL_URL=https://$FQDN" >> $GITHUB_ENV
          fi
      
      - name: Update Container App env vars
        run: |
          # Carregar variáveis do App Config
          APP_CONFIG_NAME="appconfig-arcs-porschecup-hml2"
          get_config_value() {
            local key=$1
            local secret_fallback=$2
            az appconfig kv show --name "$APP_CONFIG_NAME" --key "$key" --label "backend" --query "value" -o tsv 2>/dev/null || \
            az appconfig kv show --name "$APP_CONFIG_NAME" --key "$key" --query "value" -o tsv 2>/dev/null || \
            echo "$secret_fallback"
          }
          
          # Carregar secrets do Key Vault
          KV_NAME="${{ env.ARCS_KV_NAME_HML2 }}"
          if [ -z "$KV_NAME" ]; then
            KV_NAME="arcs-kv-hml2"
          fi
          get_kv_secret() {
            local secret_name=$1
            az keyvault secret show --vault-name "$KV_NAME" --name "$secret_name" --query "value" -o tsv 2>/dev/null || echo ""
          }
          
          ARCS_POSTGRES_SERVER_HML2=$(get_config_value "ARCS_POSTGRES_SERVER_HML2" "${{ secrets.ARCS_POSTGRES_SERVER_HML2 }}")
          POSTGRES_DB_HML2=$(get_config_value "POSTGRES_DB_HML2" "${{ secrets.POSTGRES_DB_HML2 }}")
          POSTGRES_PASSWORD_HML2=$(get_config_value "POSTGRES_PASSWORD_HML2" "${{ secrets.POSTGRES_PASSWORD_HML2 }}")
          STORAGE_NAME_HML2=$(get_config_value "STORAGE_NAME_HML2" "${{ secrets.STORAGE_NAME_HML2 }}")
          STORAGE_KEY_HML2=$(get_config_value "STORAGE_KEY_HML2" "${{ secrets.STORAGE_KEY_HML2 }}")
          STORAGE_BLOB_URL_HML2=$(get_config_value "STORAGE_BLOB_URL_HML2" "${{ secrets.STORAGE_BLOB_URL_HML2 }}")
          
          # Tentar obter do Key Vault se não estiver no App Config
          if [ -z "$POSTGRES_PASSWORD_HML2" ]; then
            POSTGRES_PASSWORD_HML2=$(get_kv_secret "POSTGRES-PASSWORD-HML2")
          fi
          if [ -z "$STORAGE_KEY_HML2" ]; then
            STORAGE_KEY_HML2=$(get_kv_secret "STORAGE-KEY-HML2")
          fi
          
          # Obter SECRET_ARCS_TOKEN do Key Vault (shared-secret-microservices) ou Secrets
          # O código adiciona automaticamente o prefixo "TOKEN " quando busca do Key Vault
          # Mas se definirmos como variável de ambiente, precisamos adicionar o prefixo manualmente
          SECRET_ARCS_TOKEN_RAW=$(get_kv_secret "shared-secret-microservices" || echo "${{ secrets.SECRET_ARCS_TOKEN }}")
          
          # Adicionar prefixo "TOKEN " se não tiver
          if [[ ! "$SECRET_ARCS_TOKEN_RAW" =~ ^TOKEN[[:space:]] ]]; then
            SECRET_ARCS_TOKEN_HML2="TOKEN $SECRET_ARCS_TOKEN_RAW"
          else
            SECRET_ARCS_TOKEN_HML2="$SECRET_ARCS_TOKEN_RAW"
          fi
          
          # Construir lista de variáveis de ambiente
          ENV_VARS=(
            "MICROSERVICE_INTERNAL_URL=${{ env.MICROSERVICE_INTERNAL_URL }}"
            "MICROSERVICE_EXTERNAL_URL=${{ env.MICROSERVICE_EXTERNAL_URL }}"
            "ARCS_SERVICE_INTERNAL_URL=${{ env.ARCS_SERVICE_INTERNAL_URL }}"
            "MICROSERVICE_PORT=8000"
            "REDIS_HOST=redis-arcs-porschecup-hml2.redis.cache.windows.net"
            "REDIS_PORT=6379"
            "REDIS_PASSWORD=${{ env.REDIS_PASSWORD_HML2 }}"
            "REDIS_SSL_PORT=6380"
            "ENV=HOMOLOG"
            "SECRET_ARCS_TOKEN=$SECRET_ARCS_TOKEN_HML2"
          )
          
          # Adicionar PostgreSQL HML2 se disponível (usando FQDN privado)
          # Nota: O Service Connector cria automaticamente as variáveis AZURE_POSTGRESQL_USER_ARCS_DB_*
          # Não precisamos definir AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID manualmente
          # O código pode usar as variáveis específicas do Service Connector ou POSTGRES_AAD_USER
          if [ -n "$ARCS_POSTGRES_SERVER_HML2" ]; then
            ENV_VARS+=("POSTGRES_HOST=b83ac0e53ac6.private.postgres.database.azure.com")
            ENV_VARS+=("POSTGRES_PORT=5432")
            ENV_VARS+=("POSTGRES_DB=${POSTGRES_DB_HML2}")
            ENV_VARS+=("POSTGRES_USER=${ARCS_POSTGRES_SERVER_HML2}-admin")
            ENV_VARS+=("POSTGRES_SSLMODE=require")
            ENV_VARS+=("POSTGRES_AAD_USER=aad_user_${POSTGRES_DB_HML2}")
          fi
          if [ -n "$POSTGRES_PASSWORD_HML2" ]; then
            ENV_VARS+=("postgres_password=${POSTGRES_PASSWORD_HML2}")
          fi
          
          # Adicionar Storage HML2 se disponível
          if [ -n "$STORAGE_NAME_HML2" ]; then
            ENV_VARS+=("storage_name=${STORAGE_NAME_HML2}")
          fi
          if [ -n "$STORAGE_KEY_HML2" ]; then
            ENV_VARS+=("storage_key=${STORAGE_KEY_HML2}")
          fi
          if [ -n "$STORAGE_BLOB_URL_HML2" ]; then
            ENV_VARS+=("STORAGE_BLOB_URL=${STORAGE_BLOB_URL_HML2}")
          fi
          
          # Atualizar Container App
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RG_NAME_ARCS_HML2 }} \
            --set-env-vars "${ENV_VARS[@]}"
      
      - name: Wait for Container App ready
        run: |
          for i in {1..30}; do
            STATUS=$(az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --query "properties.provisioningState" -o tsv 2>/dev/null || echo "Unknown")
            [ "$STATUS" == "Succeeded" ] && break
            sleep 10
          done
          
          if [ "$STATUS" != "Succeeded" ]; then
            echo "⚠️  Container App ainda não está 'Succeeded', mas continuando..."
          fi
          
          sleep 30

      - name: Get Container App FQDN
        run: |
          # Obter FQDN do Container App (mantém externo para APIM externo acessar)
          FQDN=$(az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --query "properties.configuration.ingress.fqdn" -o tsv)
          if [ -n "$FQDN" ]; then
            echo "microservice_url=https://$FQDN" >> $GITHUB_ENV
            echo "MICROSERVICE_INTERNAL_URL=https://$FQDN" >> $GITHUB_ENV
            echo "ARCS_SERVICE_INTERNAL_URL=https://$FQDN" >> $GITHUB_ENV
            echo "✅ Container App FQDN: https://$FQDN (ingress externo)"
          else
            echo "⚠️  FQDN não encontrado"
          fi

      - name: Setup VM access (autenticação por senha)
        run: |
          # Instalar sshpass para autenticação por senha
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          
          # Valores hardcoded da VM (sem App Config ou Secrets)
          # Usando vm-teste-apim-hml2 com IP público (172.177.27.230)
          VM_IP_HML2="172.177.27.230"
          VM_USER_HML2="azureuser"
          VM_PASSWORD="Jesus@2025@2026"
          
          echo "VM_IP_HML2=$VM_IP_HML2" >> $GITHUB_ENV
          echo "VM_USER_HML2=$VM_USER_HML2" >> $GITHUB_ENV
          echo "SSH_PASSWORD=$VM_PASSWORD" >> $GITHUB_ENV
          
          echo "✅ Credenciais da VM configuradas (hardcoded)"
          
          # Configurar known_hosts (evitar prompt de confirmação)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VM_IP_HML2" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts
          
          echo "✅ Autenticação por senha configurada para $VM_USER_HML2@$VM_IP_HML2"

      - name: Execute post_boot and register_microservice via VM
        run: |
          # Obter URL do container (FQDN externo ou interno)
          CONTAINER_URL="${{ env.microservice_url }}"
          if [ -z "$CONTAINER_URL" ]; then
            CONTAINER_URL=$(az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")
            if [ -n "$CONTAINER_URL" ]; then
              CONTAINER_URL="https://$CONTAINER_URL"
            fi
          fi
          
          if [ -z "$CONTAINER_URL" ]; then
            echo "❌ Erro: Não foi possível obter URL do container"
            exit 1
          fi
          
          echo "Container URL: $CONTAINER_URL"
          echo "VM: ${{ env.VM_USER_HML2 }}@${{ env.VM_IP_HML2 }}"
          
          # Senha da VM (hardcoded - sem Key Vault ou Secrets)
          SSH_PASSWORD="Jesus@2025@2026"
          
          # Copiar script para VM usando senha
          echo "📋 Copiando script para VM..."
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            scripts/execute_container_requests.sh \
            ${{ env.VM_USER_HML2 }}@${{ env.VM_IP_HML2 }}:/tmp/execute_container_requests.sh
          
          # Tornar script executável
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ env.VM_USER_HML2 }}@${{ env.VM_IP_HML2 }} \
            "chmod +x /tmp/execute_container_requests.sh"
          
          # Executar script na VM
          echo "🚀 Executando script na VM..."
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ env.VM_USER_HML2 }}@${{ env.VM_IP_HML2 }} \
            "/tmp/execute_container_requests.sh '$CONTAINER_URL' '${{ secrets.SECRET_ARCS_TOKEN }}'"
          
          # Buscar resultados
          echo "📥 Buscando resultados da VM..."
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ env.VM_USER_HML2 }}@${{ env.VM_IP_HML2 }}:/tmp/container_results.txt \
            /tmp/container_results.txt 2>/dev/null || true
          
          # Exibir resultados
          if [ -f /tmp/container_results.txt ]; then
            echo ""
            echo "=========================================="
            echo "Resultados das requisições"
            echo "=========================================="
            cat /tmp/container_results.txt
            echo ""
            
            # Carregar resultados como variáveis de ambiente
            source /tmp/container_results.txt 2>/dev/null || true
            
            # Verificar se houve sucesso
            if [ "${POST_BOOT_STATUS:-failed}" == "success" ] && [ "${REGISTER_STATUS:-failed}" == "success" ]; then
              echo "✅ post_boot e register_microservice executados com sucesso!"
            elif [ "${POST_BOOT_STATUS:-failed}" == "success" ]; then
              echo "⚠️  post_boot OK, mas register_microservice falhou"
            elif [ "${REGISTER_STATUS:-failed}" == "success" ]; then
              echo "⚠️  register_microservice OK, mas post_boot falhou"
            else
              echo "❌ Ambos falharam"
              exit 1
            fi
          else
            echo "⚠️  Não foi possível obter resultados da VM"
          fi

      - name: Configure API in APIM
        run: |
          API_ID="${{ env.CONTAINER_APP_NAME }}"
          BACKEND_URL="${{ env.microservice_url }}"
          PROTOCOLS="${{ vars.APIM_API_PROTOCOLS }}"
          [ -z "$PROTOCOLS" ] && PROTOCOLS="https"
          
          DISPLAY_NAME="${{ vars.APIM_API_NAME_FRIENDLY }}"
          [ -z "$DISPLAY_NAME" ] && DISPLAY_NAME="$API_ID"
          
          API_PATH="${{ vars.APIM_API_ROUTE_PATH }}"
          [ -z "$API_PATH" ] && API_PATH="/$(echo $API_ID | tr '[:upper:]' '[:lower:]')"
          
          API_DESCRIPTION="${{ vars.APIM_API_DESCRIPTION }}"
          [ -z "$API_DESCRIPTION" ] && API_DESCRIPTION="API for $API_ID"
          
          if az apim api show --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --service-name ${{ env.APIM_NAME_HML2 }} --api-id "$API_ID" --output none 2>/dev/null; then
            az apim api update --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --service-name ${{ env.APIM_NAME_HML2 }} \
              --api-id "$API_ID" --display-name "$DISPLAY_NAME" \
              --path "$API_PATH" --service-url "$BACKEND_URL" \
              --protocols "$PROTOCOLS" --description "$API_DESCRIPTION"
          else
            az apim api create --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --service-name ${{ env.APIM_NAME_HML2 }} \
              --api-id "$API_ID" --display-name "$DISPLAY_NAME" \
              --path "$API_PATH" --service-url "$BACKEND_URL" \
              --protocols "$PROTOCOLS" --description "$API_DESCRIPTION"
          fi

      - name: Import OpenAPI specification
        run: |
          if [ ! -f "${{ github.workspace }}/infra/openapi.yml" ]; then
            echo "⚠️  OpenAPI file not found - skipping"
            exit 0
          fi
          
          API_ID="${{ env.CONTAINER_APP_NAME }}"
          DISPLAY_NAME="${{ vars.APIM_API_NAME_FRIENDLY }}"
          [ -z "$DISPLAY_NAME" ] && DISPLAY_NAME="$API_ID"
          
          API_PATH="${{ vars.APIM_API_ROUTE_PATH }}"
          [ -z "$API_PATH" ] && API_PATH="/$(echo $API_ID | tr '[:upper:]' '[:lower:]')"
          
          API_DESCRIPTION="${{ vars.APIM_API_DESCRIPTION }}"
          [ -z "$API_DESCRIPTION" ] && API_DESCRIPTION="API for $API_ID"
          
          az apim api import --resource-group ${{ env.RG_NAME_ARCS_HML2 }} --service-name ${{ env.APIM_NAME_HML2 }} \
            --api-id "$API_ID" --path "$API_PATH" \
            --display-name "$DISPLAY_NAME" --description "$API_DESCRIPTION" \
            --service-url "${{ env.microservice_url }}" --specification-path ${{ github.workspace }}/infra/openapi.yml \
            --specification-format OpenApi --protocols https
